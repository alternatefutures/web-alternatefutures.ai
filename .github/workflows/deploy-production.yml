name: Deploy to Production (Alternate Clouds)

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: alternate-clouds-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate deployment configuration
        shell: bash
        env:
          AF_TOKEN: ${{ secrets.AF_TOKEN }}
          AF_ORG_ID: ${{ vars.AF_ORG_ID }}
          AF_PROJECT_ID: ${{ vars.AF_PROJECT_ID }}
          AF_SERVICE_ID: ${{ vars.AF_SERVICE_ID }}
        run: |
          set -euo pipefail
          test -n "$AF_TOKEN" || { echo "Missing production secret: AF_TOKEN"; exit 1; }
          test -n "$AF_ORG_ID" || { echo "Missing production variable: AF_ORG_ID"; exit 1; }
          test -n "$AF_PROJECT_ID" || { echo "Missing repository variable: AF_PROJECT_ID"; exit 1; }
          test -n "$AF_SERVICE_ID" || { echo "Missing repository variable: AF_SERVICE_ID"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish website image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_STAGING=false

      - name: Install Alternate Clouds CLI
        run: npm install -g @alternatefutures/acc@1.8.0

      - name: Verify Alternate Clouds CLI
        run: acc --version

      - name: Point service at release image
        shell: bash
        env:
          AF_TOKEN: ${{ secrets.AF_TOKEN }}
          AF_ORG_ID: ${{ vars.AF_ORG_ID }}
          AF_SERVICE_ID: ${{ vars.AF_SERVICE_ID }}
        run: |
          set -euo pipefail
          release_image="${IMAGE_NAME}:${GITHUB_SHA}"
          payload="$(jq -cn \
            --arg serviceId "$AF_SERVICE_ID" \
            --arg dockerImage "$release_image" \
            '{
              query: "mutation UpdateService($serviceId: ID!, $input: UpdateServiceInput!) { updateService(serviceId: $serviceId, input: $input) { id dockerImage } }",
              variables: {
                serviceId: $serviceId,
                input: { dockerImage: $dockerImage }
              }
            }')"
          response="$(curl --fail-with-body --silent --show-error \
            https://api.alternatefutures.ai/graphql \
            -H "Authorization: Bearer ${AF_TOKEN}" \
            -H "X-Organization-Id: ${AF_ORG_ID}" \
            -H "Content-Type: application/json" \
            --data "$payload")"
          jq -e '(.errors // []) | length == 0' <<<"$response" >/dev/null
          test "$(jq -r '.data.updateService.dockerImage // empty' <<<"$response")" = "$release_image"

      - name: Record deploy-attempt baseline
        id: baseline
        shell: bash
        env:
          AF_TOKEN: ${{ secrets.AF_TOKEN }}
          AF_ORG_ID: ${{ vars.AF_ORG_ID }}
          AF_SERVICE_ID: ${{ vars.AF_SERVICE_ID }}
        run: |
          set -euo pipefail
          payload="$(jq -cn \
            --arg serviceId "$AF_SERVICE_ID" \
            '{
              query: "query ServiceAttempts($serviceId: ID!) { service(id: $serviceId) { metrics { totalAttempts } } }",
              variables: { serviceId: $serviceId }
            }')"
          response="$(curl --fail-with-body --silent --show-error \
            https://api.alternatefutures.ai/graphql \
            -H "Authorization: Bearer ${AF_TOKEN}" \
            -H "X-Organization-Id: ${AF_ORG_ID}" \
            -H "Content-Type: application/json" \
            --data "$payload")"
          attempts="$(jq -r '.data.service.metrics.totalAttempts // 0' <<<"$response")"
          echo "attempts=${attempts:-0}" >> "$GITHUB_OUTPUT"

      - name: Redeploy production service
        env:
          AF_TOKEN: ${{ secrets.AF_TOKEN }}
          AF_ORG_ID: ${{ vars.AF_ORG_ID }}
          AF_PROJECT_ID: ${{ vars.AF_PROJECT_ID }}
          AF_SERVICE_ID: ${{ vars.AF_SERVICE_ID }}
        run: acc services deploy "$AF_SERVICE_ID" --yes

      - name: Verify a deploy attempt was recorded
        shell: bash
        env:
          AF_TOKEN: ${{ secrets.AF_TOKEN }}
          AF_ORG_ID: ${{ vars.AF_ORG_ID }}
          AF_SERVICE_ID: ${{ vars.AF_SERVICE_ID }}
          BASELINE: ${{ steps.baseline.outputs.attempts }}
        run: |
          set -euo pipefail
          payload="$(jq -cn \
            --arg serviceId "$AF_SERVICE_ID" \
            '{
              query: "query ServiceAttempts($serviceId: ID!) { service(id: $serviceId) { metrics { totalAttempts lastDeployedAt } } }",
              variables: { serviceId: $serviceId }
            }')"
          for i in $(seq 1 20); do
            response="$(curl --fail-with-body --silent --show-error \
              https://api.alternatefutures.ai/graphql \
              -H "Authorization: Bearer ${AF_TOKEN}" \
              -H "X-Organization-Id: ${AF_ORG_ID}" \
              -H "Content-Type: application/json" \
              --data "$payload")"
            attempts="$(jq -r '.data.service.metrics.totalAttempts // 0' <<<"$response")"
            if [ "${attempts:-0}" -gt "$BASELINE" ]; then
              echo "Deploy attempt recorded: totalAttempts $BASELINE -> $attempts"
              exit 0
            fi
            sleep 15
          done
          echo "acc reported success but no deploy attempt was recorded after 5 minutes" >&2
          exit 1
