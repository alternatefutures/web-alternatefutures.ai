name: Deploy to Production (Alternate Clouds)

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: alternate-clouds-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate deployment configuration
        shell: bash
        env:
          AF_TOKEN: ${{ secrets.AF_TOKEN }}
          AF_PROJECT_ID: ${{ vars.AF_PROJECT_ID }}
          AF_SERVICE_ID: ${{ vars.AF_SERVICE_ID }}
        run: |
          set -euo pipefail
          test -n "$AF_TOKEN" || { echo "Missing production secret: AF_TOKEN"; exit 1; }
          test -n "$AF_PROJECT_ID" || { echo "Missing repository variable: AF_PROJECT_ID"; exit 1; }
          test -n "$AF_SERVICE_ID" || { echo "Missing repository variable: AF_SERVICE_ID"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish website image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_STAGING=false

      - name: Install Alternate Clouds CLI
        run: npm install -g @alternatefutures/acc@1.8.0

      - name: Verify Alternate Clouds CLI
        run: acc --version

      - name: Redeploy production service
        env:
          AF_TOKEN: ${{ secrets.AF_TOKEN }}
          AF_PROJECT_ID: ${{ vars.AF_PROJECT_ID }}
          AF_SERVICE_ID: ${{ vars.AF_SERVICE_ID }}
        run: acc services deploy "$AF_SERVICE_ID" --yes
